<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Launcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%231E6E52' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* A desk timetable: the day's run as steps on a rail (hollow = to do, filled green = done today, a pulsing ring
     while running, a brick ring when stalled, brick = failed), then the dashboards by group. Without the web fonts
     it falls back to Segoe UI. */
  :root {
    --paper: #EDF0EE;
    --surface: #F8FAF9;
    --ink: #17211F;
    --muted: #5E6B68;
    --rule: #CDD5D2;
    --rule-strong: #A9B5B1;
    --green: #1E6E52;
    --green-hover: #185C44;
    --on-green: #FFFFFF;
    --amber: #94600F;
    --amber-halo: rgba(148, 96, 15, .35);
    --brick: #A23E2B;
    --brick-halo: rgba(162, 62, 43, .35);
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --cond: "IBM Plex Sans Condensed", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121816;
      --surface: #18201E;
      --ink: #E3E9E6;
      --muted: #8C9A96;
      --rule: #2A3532;
      --rule-strong: #3D4A46;
      --green: #5DBB95;
      --green-hover: #74C9A5;
      --on-green: #0E1A15;
      --amber: #E0A74A;
      --amber-halo: rgba(224, 167, 74, .35);
      --brick: #E07A62;
      --brick-halo: rgba(224, 122, 98, .35);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14px/1.45 var(--sans); }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 2px; }

  .page { max-width: 54rem; margin: 0 auto; padding: 2rem 2rem 3rem; }
  .top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    padding-bottom: .875rem; border-bottom: 1px solid var(--rule-strong);
  }
  h1 { font: 600 22px/1.2 var(--cond); letter-spacing: -.005em; }
  .now, .count { font: 500 14px/1.2 var(--cond); color: var(--muted); font-variant-numeric: tabular-nums; }

  /* The Start of Day reminder (tasks.yaml remind): amber from the first time, brick from the next. */
  .remind {
    display: flex; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; margin-top: 1.25rem;
    padding: .75rem .875rem .75rem 1rem; background: var(--surface);
    border: 1px solid var(--rule); border-left: 4px solid var(--amber); border-radius: 4px;
  }
  .remind.again { border-left-color: var(--brick); }
  .remind-text { flex: 1 1 20rem; font: 600 16px/1.35 var(--cond); }
  .remind-note { display: block; font: 400 13px/1.4 var(--sans); color: var(--muted); }
  .remind-actions { display: flex; align-items: center; gap: .25rem; }

  section { padding-top: 1.25rem; }
  section + section { margin-top: 1.5rem; border-top: 1px solid var(--rule); }
  .section-head { display: flex; align-items: center; gap: .75rem; min-height: 32px; margin-bottom: 1rem; }
  .section-head .btn { margin-left: auto; }
  h2 { font: 600 16px/1.2 var(--cond); }

  /* Buttons: one filled action per step; outlined for the rest; Stop, Log and Details as text. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px;
    font: 500 14px/1 var(--sans); white-space: nowrap; text-decoration: none; cursor: pointer;
    border: 1px solid transparent; border-radius: 4px; background: none; color: var(--ink);
  }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--green); color: var(--on-green); }
  .btn.primary:not(:disabled):hover { background: var(--green-hover); }
  .btn.secondary { background: var(--surface); border-color: var(--rule-strong); }
  .btn.secondary:not(:disabled):hover { border-color: var(--muted); }
  .btn.link { padding: 0 8px; color: var(--muted); }
  .btn.link:not(:disabled):hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .btn.link.stop:not(:disabled):hover { color: var(--brick); }
  .btn.inline {
    display: inline; height: auto; padding: 0; font: inherit; color: var(--muted);
    text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px;
  }
  .btn.inline:hover { color: var(--ink); text-decoration-color: currentColor; }

  /* Today's run: the time column, the rail, the step, its actions; the log spans the step and actions columns. */
  .steps { list-style: none; margin: 0; padding: 0; }
  .step {
    --mark-top: 5px;
    --gap: 1.375rem;
    display: grid;
    grid-template-columns: 5.25rem 1.25rem minmax(0, 1fr) 10.5rem;  /* fixed actions: every step's text wraps alike */
    grid-template-areas: "when rail body actions" ".    rail log  log";
    column-gap: .875rem;
    padding-bottom: var(--gap);
  }
  .step:last-child { --gap: 0px; }
  .when {
    grid-area: when; text-align: right; white-space: nowrap;
    font: 500 14px/22px var(--cond); color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .rail { grid-area: rail; position: relative; margin-bottom: calc(-1 * var(--gap)); }
  .rail::before {
    content: ""; position: absolute; z-index: 1; left: 50%; top: var(--mark-top);
    width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
    border: 2px solid var(--rule-strong); background: var(--paper);
  }
  .step:not(:last-child) .rail::after {
    content: ""; position: absolute; left: 50%; width: 2px; margin-left: -1px;
    top: calc(var(--mark-top) + 16px); bottom: calc(4px - var(--mark-top)); background: var(--rule);
  }
  .step[data-state="done"] .rail::before { background: var(--green); border-color: var(--green); }
  .step[data-state="done"] .rail::after { background: var(--green); }
  .step[data-state="queued"] .rail::before { border-color: var(--amber); }
  .step[data-state="running"] .rail::before {
    border-color: var(--amber); background: radial-gradient(circle, var(--amber) 0 2px, var(--paper) 2.5px);
    animation: pulse 1.8s ease-out infinite;
  }
  .step:is([data-state="failed"], [data-state="stopped"], [data-state="unknown"], [data-state="abandoned"]) .rail::before {
    background: var(--brick); border-color: var(--brick);
  }
  .step[data-state="stalled"] .rail::before {  /* still running, but silent too long */
    border-color: var(--brick); background: radial-gradient(circle, var(--brick) 0 2px, var(--paper) 2.5px);
    animation: pulse-brick 1.8s ease-out infinite;
  }
  @keyframes pulse {
    from { box-shadow: 0 0 0 0 var(--amber-halo); }
    to { box-shadow: 0 0 0 8px transparent; }
  }
  @keyframes pulse-brick {
    from { box-shadow: 0 0 0 0 var(--brick-halo); }
    to { box-shadow: 0 0 0 8px transparent; }
  }

  .body { grid-area: body; min-width: 0; }
  .name { font: 600 16px/22px var(--cond); }
  .state { margin-top: 1px; font: 500 14px/1.35 var(--cond); color: var(--muted); font-variant-numeric: tabular-nums; }
  .step[data-state="done"] .state { color: var(--green); }
  .step:is([data-state="running"], [data-state="queued"]) .state { color: var(--amber); }
  .step:is([data-state="failed"], [data-state="stopped"], [data-state="unknown"], [data-state="stalled"], [data-state="abandoned"]) .state {
    color: var(--brick);
  }
  .warn { margin-top: .25rem; font: 500 14px/1.35 var(--cond); color: var(--amber); }
  .warn.late { color: var(--brick); }
  .summary, .desc, .preview { max-width: 66ch; margin-top: .375rem; }
  .desc { color: var(--muted); white-space: pre-line; }
  .preview { color: var(--amber); }
  .preview.fail { color: var(--brick); }
  .bar { height: 3px; margin-top: .625rem; background: var(--rule); border-radius: 2px; overflow: hidden; }
  .bar > span { display: block; width: 0; height: 100%; background: var(--amber); transition: width .4s; }
  .step:is([data-state="failed"], [data-state="stopped"], [data-state="stalled"], [data-state="abandoned"]) .bar > span {
    background: var(--brick);
  }
  .last-line {
    margin-top: .375rem; font: 12px/1.4 var(--mono); color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .actions {
    grid-area: actions; align-self: start; display: flex; align-items: center; justify-content: flex-end; gap: .25rem;
    margin-top: -5px;
  }
  .log {
    grid-area: log; margin: .75rem 0 0; padding: .625rem .75rem; max-height: 20rem; overflow: auto;
    font: 12px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; word-break: break-word;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 4px;
  }

  /* Dashboards, by group */
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 1.25rem 2.5rem; align-items: start; }
  .group h3 {
    padding-bottom: .375rem; border-bottom: 1px solid var(--rule-strong);
    font: 600 14px/1.3 var(--cond); color: var(--muted);
  }
  .apps { list-style: none; margin: 0; padding: 0; }
  .app { display: flex; align-items: center; gap: .625rem; min-height: 2.75rem; padding: .375rem 0; border-bottom: 1px solid var(--rule); }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--rule-strong); }
  .app[data-state="up"] .dot { background: var(--green); border-color: var(--green); }
  .app[data-state="partial"] .dot { border-color: var(--amber); }
  .app-label { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .5rem; }
  .app-name { font-weight: 500; }
  .app-state { font: 500 12px/1.3 var(--cond); color: var(--muted); }
  .app[data-state="up"] .app-state { color: var(--green); }
  .app[data-state="partial"] .app-state { color: var(--amber); }
  .app-actions { display: flex; align-items: center; gap: .25rem; }
  .app .btn { height: 28px; }

  .empty { color: var(--muted); }

  /* Phones (a Galaxy S24 Ultra is 412 px wide): the time goes above the step, the actions under it, and every
     button is at least 44 px tall. */
  @media (max-width: 640px) {
    .page { padding: 1rem 1rem 2.5rem; }
    .top { flex-direction: column; align-items: flex-start; gap: .25rem; }
    .btn { min-height: 44px; padding: 0 16px; font-size: 15px; }
    .btn.link { padding: 0 10px; }
    .btn.inline { min-height: 0; padding: 0; font-size: inherit; }
    .step {
      --mark-top: 3px;
      grid-template-columns: 1.25rem minmax(0, 1fr);
      grid-template-areas: "rail when" "rail body" "rail actions" "rail log";
      column-gap: .75rem;
    }
    .when { text-align: left; font-size: 12px; line-height: 18px; }
    .actions { margin-top: .75rem; }
    .actions .start { flex: 1; }
    .last-line { white-space: normal; word-break: break-word; }
    .log { max-height: 60vh; }
    .groups { grid-template-columns: 1fr; }
    .app .btn { height: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .step:is([data-state="running"], [data-state="stalled"]) .rail::before { animation: none; }
    .bar > span { transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Launcher</h1>
    <p class="now" id="now"></p>
  </header>

  <div class="remind" id="remind" role="status" hidden>
    <p class="remind-text"><span id="remind-text"></span><span class="remind-note" id="remind-note"></span></p>
    <div class="remind-actions">
      <button type="button" class="btn link" id="remind-dismiss">Dismiss</button>
      <button type="button" class="btn primary" id="remind-start">Start now</button>
    </div>
  </div>

  <section aria-labelledby="run-heading">
    <div class="section-head">
      <h2 id="run-heading">Today's run</h2>
      <span class="count" id="run-count"></span>
      <button type="button" class="btn secondary" id="run-all">Run all</button>
    </div>
    <ol class="steps" id="tasks"></ol>
  </section>

  <section aria-labelledby="dash-heading">
    <div class="section-head">
      <h2 id="dash-heading">Dashboards</h2>
      <span class="count" id="dash-count"></span>
    </div>
    <div class="groups" id="groups"></div>
  </section>
</div>

<template id="tpl-step">
  <li class="step" data-state="todo">
    <div class="when"></div>
    <div class="rail" aria-hidden="true"></div>
    <div class="body">
      <h3 class="name"></h3>
      <p class="state"></p>
      <p class="warn" hidden></p>
      <p class="summary"><span class="summary-text"></span> <button type="button" class="btn inline details" aria-expanded="false">Details</button></p>
      <p class="desc" hidden></p>
      <p class="preview" hidden></p>
      <div class="bar" hidden><span></span></div>
      <p class="last-line" hidden></p>
    </div>
    <div class="actions">
      <button type="button" class="btn link log-toggle" aria-expanded="false">Log</button>
      <button type="button" class="btn link stop">Stop</button>
      <button type="button" class="btn primary start">Start</button>
    </div>
    <pre class="log" hidden></pre>
  </li>
</template>

<template id="tpl-group">
  <div class="group"><h3></h3><ul class="apps"></ul></div>
</template>

<template id="tpl-app">
  <li class="app" data-state="checking">
    <span class="dot" aria-hidden="true"></span>
    <span class="app-label"><span class="app-name"></span><span class="app-state">Checking</span></span>
    <span class="app-actions">
      <button type="button" class="btn link stop" hidden>Stop</button>
      <a class="btn secondary open" target="_blank" rel="noopener" hidden>Open</a>
      <button type="button" class="btn secondary start" hidden>Start</button>
    </span>
  </li>
</template>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const clone = id => document.getElementById(id).content.firstElementChild.cloneNode(true);

const hhmm = iso => (iso ? iso.slice(11, 16) : "");
const minutes = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
const isToday = iso => iso && iso.slice(0, 10) === new Date().toLocaleDateString("en-CA");

function tick() {
  const d = new Date();
  const weekday = d.toLocaleDateString("en-AU", { weekday: "long" });
  const month = d.toLocaleDateString("en-AU", { month: "long" });
  const time = d.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit", hour12: false });
  $("#now").textContent = `${weekday} ${d.getDate()} ${month}, ${time}`;
}

async function init() {
  tick();
  setInterval(tick, 10000);
  $("#run-all").onclick = runAll;
  $("#remind-dismiss").onclick = () => {
    if (reminder) dismissed = `${reminder.task_id}|${reminder.t}|${reminder.slot}`;
    $("#remind").hidden = true;
    document.title = "Launcher";
  };
  $("#remind-start").onclick = () => {
    if (!reminder) return;
    $("#remind-start").disabled = true;
    startTask(reminder.task_id);
  };
  refreshTasks();
  renderApps(await (await fetch("/api/apps")).json());
  refresh();
  setInterval(refresh, 3000);
}

// ---------- Today's run (tasks.yaml) ----------
let stopGraceS = 20;  // Stop asks first, then ends the run by force this long after (from /api/tasks)
const openLogs = new Set();
const tasksById = {};
const lastState = {};
let taskTimer = null;

// The rail marker and the colour of the state line: a success from an earlier day is due again, so it is "todo".
// With a progress file (tasks.yaml progress_file), a run can also be stalled (running, no output for over 10 min)
// or abandoned (the file says running, but its process is gone).
function stepState(t) {
  const r = t.run;
  const p = r && r.progress;
  if (t.queued) return "queued";
  if (!r) return "todo";
  if (p && p.abandoned && r.state !== "stopped") return "abandoned";  // a run Stop ended says so instead
  if (r.state === "running" && p && p.stalled) return "stalled";
  if (r.state === "done") return t.done_today ? "done" : "todo";
  return r.state;  // running, failed, stopped, unknown
}

function stateText(t) {
  const r = t.run;
  if (t.queued) return "Queued";
  if (!r) return "Not run yet";
  const at = isToday(r.started) ? hhmm(r.started) : `${r.started.slice(0, 10)} ${hhmm(r.started)}`;
  const step = r.step ? `step ${r.step.k} of ${r.step.n}: ${r.step.title}` : "";
  const p = r.progress;
  const ran = minutes(r.started, new Date());
  if (p && p.abandoned && r.state !== "stopped") {
    return `Abandoned at ${step || "the start"}: its process is gone and left no result, ${at}`;
  }
  if (r.state === "running" && r.stopping) {
    return `Stopping${step ? ` at ${step}` : ""}: asked to end, by force after ${stopGraceS} s`;
  }
  if (r.state === "running" && p) {  // the progress file's ETA replaces expected_minutes
    if (p.stalled) return `Stalled: no output for ${p.idle_min} min, at ${step || "the start"} (${ran} min)`;
    const eta = p.eta ? `, ETA ${p.eta}` : "";
    const idle = p.idle_min === null ? "" : p.idle_min < 1 ? "; output just now" : `; last output ${p.idle_min} min ago`;
    return `Running${step ? `, ${step}` : ""} (${ran} min${eta}${idle})`;
  }
  if (r.state === "running") {
    const of = t.expected_minutes ? ` of about ${t.expected_minutes}` : "";
    return `Running${step ? `, ${step}` : ""} (${ran} min${of})`;
  }
  if (r.state === "done") {
    if (!t.done_today) return `Last done ${at}`;
    const took = r.finished ? `, ${minutes(r.started, r.finished)} min` : "";
    return `Done at ${hhmm(r.finished || r.started)}${took}`;
  }
  const where = step ? `at ${step}` : "at the start";
  if (r.state === "failed") return `Failed ${where}, ${at}`;
  if (r.state === "stopped") {
    const silent = p && p.abandoned ? ", so it recorded nothing" : "";  // its progress file still says running
    if (r.stop === "forced") {
      return `Stopped by force ${where}, ${at}: it had not ended ${stopGraceS} s after being asked${silent}`;
    }
    if (r.stop === "killed") return `Stopped by force ${where}, ${at}: it could not be asked to end${silent}`;
    return `Stopped ${where}, ${at}`;
  }
  return `Result unknown: the launcher restarted during the run, ${at}`;
}

// While it runs: a finish after the task's deliver-by time, and running on battery.
function warnText(t) {
  const r = t.run;
  const p = r && r.progress;
  if (!p || r.state !== "running" || p.abandoned) return "";
  const out = [];
  if (p.late) {
    out.push(p.eta && p.eta > p.deliver_by
      ? `ETA ${p.eta} is after the ${p.deliver_by} deliver-by`
      : `Still running after the ${p.deliver_by} deliver-by`);
  }
  if (p.on_battery) out.push("On battery: plug in");
  return out.length ? `${out.join(". ")}.` : "";
}

function barWidth(t) {
  const r = t.run;
  if (!r || t.queued) return 0;
  if (r.state === "done") return t.done_today ? 100 : 0;
  if (!r.step) return 2;
  const k = r.state === "running" ? r.step.k - 0.5 : r.step.k;  // a running step is half done
  return Math.round((100 * k) / r.step.n);
}

function renderTask(t) {
  tasksById[t.id] = t;
  let el = document.getElementById(`task-${t.id}`);
  if (!el) {
    el = clone("tpl-step");
    el.id = `task-${t.id}`;
    $(".start", el).onclick = () => startTask(t.id);
    $(".stop", el).onclick = () => stopTask(t.id);
    $(".log-toggle", el).onclick = () => toggleLog(t.id);
    $(".details", el).onclick = e => {
      const desc = $(".desc", el);
      desc.hidden = !desc.hidden;
      e.currentTarget.setAttribute("aria-expanded", String(!desc.hidden));
      e.currentTarget.textContent = desc.hidden ? "Details" : "Hide details";
    };
    $("#tasks").append(el);
    if (t.has_preview) loadPreview(t.id);
  }
  const state = stepState(t);
  const running = Boolean(t.run && t.run.state === "running");  // stalled counts: it can still be stopped
  el.dataset.state = state;
  $(".when", el).textContent = t.when;
  $(".name", el).textContent = t.label;
  $(".state", el).textContent = stateText(t);
  const warn = warnText(t);
  $(".warn", el).textContent = warn;
  $(".warn", el).hidden = !warn;
  $(".warn", el).classList.toggle("late", Boolean(t.run && t.run.progress && t.run.progress.late));
  $(".summary-text", el).textContent = t.summary || t.description;
  $(".details", el).hidden = !(t.summary && t.description);  // no summary: the description is already shown
  $(".desc", el).textContent = t.description;
  $(".bar", el).hidden = !["running", "failed", "stopped", "stalled", "abandoned"].includes(state);
  $(".bar > span", el).style.width = `${barWidth(t)}%`;
  const last = t.run && t.run.state !== "done" ? t.run.last_line || "" : "";
  $(".last-line", el).textContent = last;
  $(".last-line", el).hidden = !last;
  const start = $(".start", el);
  start.hidden = running || t.queued;
  start.disabled = false;  // startTask disables it until the run shows up
  start.textContent = t.done_today ? "Rerun" : "Start";
  $(".stop", el).hidden = !running || t.run.stopping;
  $(".log-toggle", el).hidden = !t.run;
}

// A task's preview_cmd says what today's run will do (e.g. which downloads); checked when the page opens and
// again after a run ends, since the answer can change once the run has fetched what was due.
async function loadPreview(id, fresh = false) {
  const box = $(`#task-${id} .preview`);
  box.hidden = false;
  box.classList.remove("fail");
  box.textContent = "Checking today's plan…";
  try {
    const p = await (await fetch(`/api/tasks/${id}/preview${fresh ? "?fresh=true" : ""}`)).json();
    box.textContent = p.text;
    box.classList.toggle("fail", !p.ok);
    box.hidden = !p.text;
  } catch {
    box.textContent = "Could not check today's plan.";
    box.classList.add("fail");
  }
}

async function refreshTasks() {
  clearTimeout(taskTimer);
  let data;
  try {
    data = await (await fetch("/api/tasks")).json();
  } catch {
    taskTimer = setTimeout(refreshTasks, 5000);
    return;
  }
  const tasks = data.tasks;
  stopGraceS = data.stop_grace_s;
  if (!tasks.length) $("#tasks").innerHTML = '<li class="empty">No tasks yet: add them to tasks.yaml.</li>';
  tasks.forEach(renderTask);
  renderReminder(data.reminders);
  for (const t of tasks) {  // a run just ended: what is due has changed
    const state = t.run ? t.run.state : "none";
    if (t.has_preview && lastState[t.id] === "running" && state !== "running") loadPreview(t.id, true);
    lastState[t.id] = state;
  }
  const done = tasks.filter(t => t.done_today).length;
  const busy = data.running_all || tasks.some(t => t.run && t.run.state === "running");
  $("#run-count").textContent = tasks.length ? `${done} of ${tasks.length} done today` : "";
  const all = $("#run-all");
  all.disabled = busy || done === tasks.length;
  all.textContent = data.running_all ? "Running…" : "Run all";
  tick();
  for (const id of openLogs) await loadLog(id);
  taskTimer = setTimeout(refreshTasks, busy ? 2000 : 5000);
}

// Start of Day reminder (tasks.yaml remind): from the first reminder time on a weekday, until the day's record
// exists or the task runs. Dismiss hides it until the next reminder time.
let reminder = null;
let dismissed = "";
let reminderKey = null;  // null until the first refresh: the page's own preview check covers that one

function renderReminder(list) {
  reminder = (list || [])[0] || null;
  const key = reminder ? `${reminder.task_id}|${reminder.t}|${reminder.slot}` : "";
  const t = reminder && tasksById[reminder.task_id];
  if (reminderKey !== null && key && key !== reminderKey && t && t.has_preview) loadPreview(t.id);  // a current latest start
  reminderKey = key;
  const show = Boolean(reminder) && key !== dismissed;
  const box = $("#remind");
  box.hidden = !show;
  document.title = show ? "Start of Day not started · Launcher" : "Launcher";
  if (!show) return;
  box.classList.toggle("again", reminder.again);
  if ($("#remind-text").textContent !== reminder.text) $("#remind-text").textContent = reminder.text;
  const note = `Reminder of ${reminder.slot}: no record for ${reminder.t} yet, and no run going.`;
  if ($("#remind-note").textContent !== note) $("#remind-note").textContent = note;
  $("#remind-start").textContent = t ? `Start ${t.label}` : "Start now";
  $("#remind-start").disabled = false;
}

async function loadLog(id) {
  const pre = $(`#task-${id} pre.log`);
  const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
  pre.textContent = await (await fetch(`/api/tasks/${id}/log`)).text() || "(empty log)";
  if (atEnd) pre.scrollTop = pre.scrollHeight;  // follow the log unless the user scrolled up
}

async function toggleLog(id) {
  const pre = $(`#task-${id} pre.log`);
  const btn = $(`#task-${id} .log-toggle`);
  pre.hidden = !pre.hidden;
  btn.setAttribute("aria-expanded", String(!pre.hidden));
  btn.textContent = pre.hidden ? "Log" : "Hide log";
  if (pre.hidden) openLogs.delete(id);
  else { openLogs.add(id); await loadLog(id); pre.scrollTop = pre.scrollHeight; }
}

async function startTask(id, takeOver = false) {
  const t = tasksById[id];
  if (!takeOver && t.done_today && !confirm(`${t.label} already finished today. Run it again?`)) return;
  $(`#task-${id} .start`).disabled = true;
  const url = `/api/tasks/${id}/start${takeOver ? "?take_over=true" : ""}`;
  const data = await (await fetch(url, { method: "POST" })).json();
  if (!data.ok && data.claimed_by && !takeOver) {
    // another PC started today's daily run: taking over is only for a run that ended or a PC that is off
    const ask = `${data.errors.join("\n")}\n\nTake over today's run from ${data.claimed_by} and start ${t.label} `
      + "on this PC? Only do this if that PC's run has ended or that PC is off: two runs on one day can "
      + "send duplicate orders.";
    if (confirm(ask)) return startTask(id, true);
  } else if (!data.ok) alert(`Could not start ${t.label}:\n${data.errors.join("\n")}`);
  refreshTasks();
}

async function stopTask(id) {
  const label = tasksById[id].label;
  const ask = `Stop ${label}? It is asked to end first, so it can record why; if it has not ended ${stopGraceS} s `
    + "later it is ended by force. Steps already finished are kept; the current step is cut short.";
  if (!confirm(ask)) return;
  $(`#task-${id} .stop`).hidden = true;
  await fetch(`/api/tasks/${id}/stop`, { method: "POST" });
  refreshTasks();
}

async function runAll() {
  $("#run-all").disabled = true;
  await fetch("/api/tasks/run-all", { method: "POST" });
  refreshTasks();
}

// ---------- Dashboards (apps.yaml) ----------
const APP_STATE = { up: "Running", partial: "Starting", down: "Stopped" };
const appLabels = {};

function renderApps(apps) {
  const root = $("#groups");
  if (!apps.length) {
    root.innerHTML = '<p class="empty">No dashboards yet: add them to apps.yaml.</p>';
    return;
  }
  const groups = new Map();  // in the order they first appear
  for (const a of apps) {
    if (!groups.has(a.group)) groups.set(a.group, []);
    groups.get(a.group).push(a);
  }
  for (const [name, list] of groups) {
    const g = clone("tpl-group");
    $("h3", g).textContent = name;
    $("h3", g).hidden = !name;
    for (const a of list) {
      appLabels[a.id] = a.label;
      const row = clone("tpl-app");
      row.id = `app-${a.id}`;
      $(".app-name", row).textContent = a.label;
      $(".start", row).onclick = () => startApp(a.id);
      $(".stop", row).onclick = () => stopApp(a.id);
      $(".apps", g).append(row);
    }
    root.append(g);
  }
}

async function refresh() {
  let data;
  try {
    data = await (await fetch("/api/status")).json();
  } catch {
    return;
  }
  let up = 0;
  let n = 0;
  for (const id in data) {
    const row = document.getElementById(`app-${id}`);
    if (!row) continue;
    const { state, open_port } = data[id];
    n += 1;
    if (state === "up") up += 1;
    row.dataset.state = state;
    $(".app-state", row).textContent = APP_STATE[state] || state;
    const open = $(".open", row);
    open.href = `http://${location.hostname}:${open_port}`;  // the host this page came from: localhost here, the laptop's address from a phone
    open.hidden = state !== "up";
    $(".start", row).hidden = state !== "down";
    $(".start", row).disabled = false;
    $(".stop", row).hidden = state === "down";
    $(".stop", row).disabled = false;
  }
  $("#dash-count").textContent = `${up} of ${n} running`;
}

async function startApp(id) {
  $(`#app-${id} .start`).disabled = true;
  const data = await (await fetch(`/api/start/${id}`, { method: "POST" })).json();
  if (!data.ok) alert(`Could not start ${appLabels[id]}:\n${data.errors.join("\n")}`);
  setTimeout(refresh, 500);
}

async function stopApp(id) {
  $(`#app-${id} .stop`).disabled = true;
  await fetch(`/api/stop/${id}`, { method: "POST" });
  setTimeout(refresh, 500);
}

init();
</script>
