# Start of Day tasks: one-shot jobs started by hand from the "Start of Day" panel. "Run all" runs them top to
# bottom and stops at the first failure, so put a task after the ones it depends on.
#
# Paths work as in apps.yaml: relative to the Marco/ folder; cmd tokens containing a slash are resolved the same way.
# Progress: the task prints lines containing "== k/n Title" (any prefix, such as a log timestamp, is fine) before
# each of its n steps. Its exit code decides Done (0) or Failed.
# preview_cmd (optional): a quick command whose last output line says what today's run will do; the panel shows it
# under the task before Start.
# summary: one line the page shows; description: the full text, behind Details. when: the time column ("from 09:30").
# progress_file (optional): a JSON file the task keeps current while it runs (schema sod_progress/1, see progress.py);
# the panel then shows the step, the time since its last output and its ETA (instead of expected_minutes), and turns
# the task red when it stalls (no output for over 10 min) or is abandoned (its process gone). timezone: the clock of
# the file's local times (deliver-by, the ETA shown) and of the reminder.
# remind (optional): a banner on weekdays from the first `at` time (again at each later one) while today's run has not
# started: no `record` for the decision date t ({t}: the weekday before today, Monday's is Friday), no run going here,
# and no live run for t in the progress file. The latest start is taken from the preview's "start by HH:MM", if any.
# Only a reminder: Start of Day stays started by hand (Trend DECISIONS 2026-10-27).

- id: aijpmt1a-refresh
  label: MTFA Start of Day
  summary: Fetches the data, waits for every market's close until 14:30, then writes the day's trade files for MTFA, MTFB and MTFC.
  when: from 09:30
  description: Free-source data, then waits for every market's close of the decision date (holidays excepted), until 14:30 Sydney at the latest, then panels, the monitoring runs and dashboards of MTFA, MTFB and MTFC, and the IBKR target envelopes of all three (MTFB's and MTFC's in their own folders).
    Start any time from about 09:30 Sydney. Done = every envelope written; Failed with exit 2 = HOLD (no envelope at all); Failed with exit 1 = MTFA's envelope is written but a clone's is not or a dashboard export failed, or a step stopped the run. data/logs/sod_<date>.json says which.
  cwd: ../Trend/AIJPMT1A_build
  cmd: ["../Trend/AIJPMT1A_build/.venv/Scripts/python.exe", "../Trend/AIJPMT1A_build/tools/daily_cycle.py"]
  preview_cmd: ["../Trend/AIJPMT1A_build/.venv/Scripts/python.exe", "../Trend/AIJPMT1A_build/tools/daily_cycle.py", "--plan"]
  expected_minutes: 47  # shown only while the run has no progress file
  progress_file: ../Trend/AIJPMT1A_build/data/logs/sod_progress.json
  timezone: Australia/Sydney
  claim: daily  # one PC per day for the daily tasks: the first to start one claims the day on GitHub
  remind:
    at: ["11:00", "12:30"]
    record: ../Trend/AIJPMT1A_build/data/logs/sod_{t}.json

- id: ibkr-paper-cycle
  label: IBKR paper cycle
  summary: Builds the day's trade list and waits for your approval; approve it on MTFA Execution, then press Start trading.
  when: by 16:25
  description: The IBKR paper book's day, on the strategy picked with "Trade on paper" on the Trend dashboard (MTFA until you switch). Start it once MTFA Start of Day says GO and before the first trading window (about 16:25 Sydney); it needs the server's gateway logged in.
    First press - pre-open, books and the day's trade list, then Done while the list waits for your approval; the log ends with the list and its cycle id. Review it on the MTFA Execution page and approve it there (the Approval box), then press Start trading. Second press - it trades the day's windows and keeps running until the night's reconcile (about 08:20 Sydney), so leave the laptop on and plugged in. Failed = halted (the log and the execution dashboard say why) or the gateway could not be reached.
  cwd: ../IBKR
  cmd: ["../IBKR/.venv/Scripts/python.exe", "-m", "src.operations", "run", "--mode", "paper", "--envelopes", "../Trend/AIJPMT1A_build/live/targets"]
  claim: daily  # runs on the PC that ran today's Start of Day (it reads that PC's envelopes)
  # its presses claim the trade day they run (IBKR's default_trade_day), not the date: a press or restart after
  # midnight Sydney stays on the day its cycle began instead of taking the next day from the other PC
  claim_day: "18:00 America/New_York"
  again_label: Start trading  # the second press, once the first has built the list (the button says Rerun otherwise)
